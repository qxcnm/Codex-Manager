[package]
name = "codexmanager-core"
version.workspace = true
edition = "2021"

[dependencies]
base64 = "0.22"
crc32fast = "1.5"
rand = "0.8"
rusqlite = { path = "../rusqlite", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
