name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "3"

jobs:
  appimage_metadata:
    name: AppImage metadata portability
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SquashFS tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: Test AppImage icon portability repair
        run: bash scripts/release/tests/ensure-appimage-diricon.test.sh

  rust_workspace:
    name: Rust workspace and WebSocket pin validation
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check WebSocket dependency pins
        run: bash scripts/ci/check-websocket-pins.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Test SQLite storage maintenance
        run: |
          cargo test -p codexmanager-core --no-fail-fast
          cargo test -p codexmanager-service --lib storage::maintenance -- --test-threads=1

      - name: Test atomic application settings
        run: |
          cargo test -p codexmanager-core --lib storage::settings:: -- --test-threads=1
          cargo test -p codexmanager-storage-seaorm --lib settings -- --test-threads=1
          cargo test -p codexmanager-service --lib app_settings -- --test-threads=1
          cargo test -p codexmanager-service --lib gateway::runtime_config::tests -- --test-threads=1
          cargo test -p codexmanager-service --lib gateway::route_hint:: -- --test-threads=1
          cargo test -p codexmanager-service --lib usage::refresh::refresh::settings::preparation_tests -- --test-threads=1
          cargo test -p codexmanager-service --test app_settings -- --test-threads=1
          cargo test -p codexmanager-service --test app_settings_atomic -- --test-threads=1
          cargo test -p codexmanager-service --test rpc rpc_gateway_transport_ -- --test-threads=1
          cargo test -p codexmanager-service --test rpc rpc_app_settings_ -- --test-threads=1

      - name: Test timeout observations, fixture isolation and WAL restore
        run: |
          cargo test -p codexmanager-service --test gateway_logs -j 2 stream_timeout_failover::
          cargo test -p codexmanager-service --lib -j 2 rpc_dispatch::network_async::tests::
          cargo test -p codexmanager-storage-seaorm --lib -j 2 transfer::tests::concurrent_fixed_timestamp_paths_are_distinct_and_exclusively_reserved
          cargo test -p codexmanager-storage-seaorm --lib -j 2 transfer::preflight_tests::

      - name: Test Responses WebSocket regressions
        run: |
          cargo test -p codexmanager-service --lib official_responses_websocket_ --no-fail-fast
          cargo test -p codexmanager-service --lib send_websocket_upstream_request_ --no-fail-fast

      - name: Test Chat streaming tool call indices
        env:
          CM_REPAIR_FIXTURE_DIR: ${{ github.workspace }}/target/chat-tool-sdk-fixtures
        run: cargo test -p codexmanager-service --lib stream_readers::chat_completions -- --test-threads=1

      - name: Test non-streaming Chat tool calls against mock upstreams
        env:
          CM_REPAIR_FIXTURE_DIR: ${{ github.workspace }}/target/chat-non-stream-sdk-fixtures
        run: "cargo test -p codexmanager-service --test gateway_logs chat_non_stream_tools:: -- --test-threads=1"

      - name: Setup Python for Chat stream SDK regression
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consume reader SSE with the official OpenAI SDK
        run: |
          python -m pip install openai==2.29.0 httpx==0.28.1
          python -B scripts/chat-tool-indices-sdk-check.py target/chat-tool-sdk-fixtures

      - name: Consume non-stream HTTP output with the official OpenAI SDK
        run: python -B scripts/chat-non-stream-tools-sdk-check.py target/chat-non-stream-sdk-fixtures

      - name: Consume public HTTP streams with the official OpenAI SDK
        run: python -B scripts/public-stream-tools-sdk-check.py target/chat-non-stream-sdk-fixtures/stream-http

      - name: Test bounded SSE readers and gateway regressions
        run: |
          cargo test -p codexmanager-service --lib gateway::http_bridge::stream_readers -- --test-threads=1
          cargo test -p codexmanager-service --lib gateway::http_bridge::aggregate -- --test-threads=1
          cargo test -p codexmanager-service --lib gateway::http_bridge::images:: -- --test-threads=1
          cargo test -p codexmanager-service --test gateway_logs -- --test-threads=1

      - name: Test local proxy fixture isolation and multi-choice tools
        run: |
          cargo test -p codexmanager-service --lib loopback_proxy_test::
          cargo test -p codexmanager-service --lib collect_non_stream_chat_sse_keeps_tools_isolated_per_choice

      - name: Test request payload storage, cleanup and detail
        run: |
          cargo test -p codexmanager-core --lib request_log_payload_store
          cargo test -p codexmanager-core --lib request_log_payload_batch
          cargo test -p codexmanager-core --lib request_log_spill
          cargo test -p codexmanager-service --lib request_log_payload -- --test-threads=1
          cargo test -p codexmanager-service --lib requestlog::detail -- --test-threads=1
          cargo test -p codexmanager-service --lib response_id_only_comes_from_successful_completed_event
          cargo test -p codexmanager-service --lib non_stream_json_only_links_real_completed_responses_id
          cargo test -p codexmanager-service --lib captured_upstream_websocket_body_matches_sent_response_create_frame

      - name: Test request payloads against mock upstreams
        run: |
          cargo test -p codexmanager-service --test gateway_logs hybrid_routing:: -- --test-threads=1
          cargo test -p codexmanager-service --test gateway_logs gateway_stateless_retry_strips_encrypted_content_on_invalid_encrypted_content -- --test-threads=1

      - name: Test SQLite shim
        run: cargo test -p rusqlite

  frontend_and_web:
    name: Frontend build and Web service tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Install frontend dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Build frontend static output
        working-directory: apps
        run: pnpm run build:desktop

      - name: Test frontend runtime
        working-directory: apps
        run: node --test --test-concurrency=1

      - name: Test Web service
        run: cargo test -p codexmanager-web --no-fail-fast

  tauri_macos:
    name: Tauri macOS arm64 bundle
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          rust-target: aarch64-apple-darwin
          enable-pnpm-cache: "false"

      - name: Install frontend dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Build frontend static output
        working-directory: apps
        run: pnpm run build:desktop

      - name: Test desktop settings publication
        run: cargo test --manifest-path apps/src-tauri/Cargo.toml commands::settings::ui::tests -- --test-threads=1

      - name: Build Tauri app bundle
        uses: ./.github/actions/build-tauri-with-retry
        with:
          working-directory: apps
          tauri-cli-version: 2.11.4
          bundles: app
          target: aarch64-apple-darwin
          shell-type: bash
          max-attempts: "1"
