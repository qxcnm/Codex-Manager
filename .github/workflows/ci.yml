name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "3"

jobs:
  rust_workspace:
    name: Rust workspace and WebSocket pin validation
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check WebSocket dependency pins
        run: bash scripts/ci/check-websocket-pins.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Test Responses WebSocket regressions
        run: |
          cargo test -p codexmanager-service --lib official_responses_websocket_ --no-fail-fast
          cargo test -p codexmanager-service --lib send_websocket_upstream_request_ --no-fail-fast

      - name: Test request payload storage, cleanup and detail
        run: |
          cargo test -p codexmanager-core --lib request_log_payload_store
          cargo test -p codexmanager-service --lib request_log_payload -- --test-threads=1
          cargo test -p codexmanager-service --lib requestlog::detail -- --test-threads=1
          cargo test -p codexmanager-service --lib response_id_only_comes_from_successful_completed_event
          cargo test -p codexmanager-service --lib non_stream_json_only_links_real_completed_responses_id
          cargo test -p codexmanager-service --lib captured_upstream_websocket_body_matches_sent_response_create_frame

      - name: Test request payloads against mock upstreams
        run: |
          cargo test -p codexmanager-service --test gateway_logs hybrid_routing:: -- --test-threads=1
          cargo test -p codexmanager-service --test gateway_logs gateway_stateless_retry_strips_encrypted_content_on_invalid_encrypted_content -- --test-threads=1

      - name: Test SQLite shim
        run: cargo test -p rusqlite

  frontend_and_web:
    name: Frontend build and Web service tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Install frontend dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Build frontend static output
        working-directory: apps
        run: pnpm run build:desktop

      - name: Test frontend runtime
        working-directory: apps
        run: node --test --test-concurrency=1

      - name: Test Web service
        run: cargo test -p codexmanager-web --no-fail-fast

  tauri_macos:
    name: Tauri macOS arm64 bundle
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          rust-target: aarch64-apple-darwin
          enable-pnpm-cache: "false"

      - name: Install frontend dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile

      - name: Build frontend static output
        working-directory: apps
        run: pnpm run build:desktop

      - name: Build Tauri app bundle
        uses: ./.github/actions/build-tauri-with-retry
        with:
          working-directory: apps
          tauri-cli-version: 2.10.1
          bundles: app
          target: aarch64-apple-darwin
          shell-type: bash
          max-attempts: "1"
